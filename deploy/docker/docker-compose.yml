# docker-compose.yml — example deployment for blackwire.
#
# Usage:
#   # Build and start:
#   docker-compose up -d
#
#   # View logs:
#   docker-compose logs -f
#
#   # Stop:
#   docker-compose down
#
# Configuration is stored exclusively in MySQL. Create the secret files under
# deploy/docker/secrets before starting this stack.

version: "3.9"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blackwire
      MYSQL_USER: blackwire
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - blackwire-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: blackwire:latest
    command: ["db", "init"]
    environment:
      BLACKWIRE_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  blackwire:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: blackwire:latest
    container_name: blackwire

    # Restart automatically unless explicitly stopped.
    restart: unless-stopped

    # Expose the main proxy port (443) and the metrics/health endpoint (8080).
    ports:
      - "443:443"
      - "8080:8080"

    # Environment
    environment:
      RUST_LOG: info
      BLACKWIRE_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      migrate:
        condition: service_completed_successfully

    # Security: drop all capabilities except what's needed for binding to :443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Read-only filesystem for the container; only /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp

    # Resource limits.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    # Health check via the /healthz endpoint.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blackwire-mysql:

secrets:
  database_url:
    file: ./secrets/database-url
  mysql_password:
    file: ./secrets/mysql-password
  mysql_root_password:
    file: ./secrets/mysql-root-password
