# docker-compose.yml — example deployment for blackwire.
#
# Usage:
#   # Build and start:
#   docker-compose up -d
#
#   # View logs:
#   docker-compose logs -f
#
#   # Stop:
#   docker-compose down
#
# Configuration is stored exclusively in MySQL. Create the secret files under
# deploy/docker/secrets before starting this stack.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blackwire
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - mysql_runtime_password
      - mysql_ui_password
      - mysql_migrator_password
    volumes:
      - blackwire-mysql:/var/lib/mysql
      - ./mysql-init-accounts.sh:/docker-entrypoint-initdb.d/10-blackwire-accounts.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: blackwire:latest
    command: ["db", "init"]
    environment:
      BLACKWIRE_DATABASE_URL_FILE: /run/secrets/migrator_database_url
    secrets:
      - migrator_database_url
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  grant-accounts:
    image: mysql:8.4
    command: ["sh", "/grant-accounts.sh"]
    volumes:
      - ./mysql-grant-accounts.sh:/grant-accounts.sh:ro
    secrets:
      - mysql_root_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  blackwire:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: blackwire:latest
    container_name: blackwire

    # Restart automatically unless explicitly stopped.
    restart: unless-stopped

    # Expose the main proxy port (443) and the metrics/health endpoint (8080).
    ports:
      - "443:443"
      - "8080:8080"

    # Environment
    environment:
      RUST_LOG: info
      BLACKWIRE_DATABASE_URL_FILE: /run/secrets/runtime_database_url
    secrets:
      - runtime_database_url
    depends_on:
      grant-accounts:
        condition: service_completed_successfully

    # Security: drop all capabilities except what's needed for binding to :443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Read-only filesystem for the container; only /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp

    # Resource limits.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    # Health check via the /healthz endpoint.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  black-ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    image: black-ui:latest
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      BLACKWIRE_DATABASE_URL_FILE: /run/secrets/ui_database_url
      BLACK_UI_LISTEN: 0.0.0.0:18080
      BLACK_UI_STATIC_DIR: /usr/share/black-ui/frontend/dist
      BLACK_UI_PUBLIC_BASE_URL: ${BLACK_UI_PUBLIC_BASE_URL:?set the externally reachable Black UI origin}
      BLACK_UI_SUBSCRIPTION_HOST: ${BLACK_UI_SUBSCRIPTION_HOST:?set the public proxy hostname or IP}
    secrets:
      - ui_database_url
    depends_on:
      grant-accounts:
        condition: service_completed_successfully

volumes:
  blackwire-mysql:

secrets:
  runtime_database_url:
    file: ./secrets/runtime-database-url
  ui_database_url:
    file: ./secrets/ui-database-url
  migrator_database_url:
    file: ./secrets/migrator-database-url
  mysql_runtime_password:
    file: ./secrets/mysql-runtime-password
  mysql_ui_password:
    file: ./secrets/mysql-ui-password
  mysql_migrator_password:
    file: ./secrets/mysql-migrator-password
  mysql_root_password:
    file: ./secrets/mysql-root-password
